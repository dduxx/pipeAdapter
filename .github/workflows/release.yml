name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  build:
    if: github.event.pull_request.merged == true
    uses: dduxx/buildscad-workflows/.github/workflows/ci.yml@v2.0.1

  release:
    if: github.event.pull_request.merged == true
    needs: build
    permissions:
      contents: write
    uses: dduxx/buildscad-workflows/.github/workflows/release.yml@v2.0.1
    with:
      build_artifacts: false
